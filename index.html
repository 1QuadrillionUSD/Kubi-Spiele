<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#33a474">
    <meta name="description" content="Eine private, werbefreie Spielesammlung für Kinder.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Meine Spiele">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Meine Spiele</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="page-title">
      <header class="home-header">
        <div>
          <p class="eyebrow">Spielesammlung</p>
          <h1 id="page-title">Meine Spiele</h1>
        </div>
        <div class="status-pill" id="install-status" aria-live="polite">Bereit</div>
      </header>

      <section class="game-grid" aria-label="Verfügbare Spiele">
        <a class="game-tile racing-tile" href="./games/autorennen/" aria-label="Autorennen starten">
          <span class="tile-art" aria-hidden="true">
            <span class="road">
              <span class="road-line"></span>
              <span class="car-shape"></span>
              <span class="fruit-dot apple"></span>
              <span class="fruit-dot banana"></span>
              <span class="fruit-dot berry"></span>
            </span>
          </span>
          <span class="tile-badge" aria-hidden="true">Start</span>
          <span class="tile-label">
            <span class="tile-title">Autorennen</span>
          </span>
        </a>
        <a class="game-tile planets-tile" href="./games/planetennamen/" aria-label="Planetennamen starten">
          <span class="tile-art planet-tile-art" aria-hidden="true">
            <span class="mini-solar-system">
              <span class="mini-sun"></span>
              <span class="mini-orbit orbit-one"></span>
              <span class="mini-orbit orbit-two"></span>
              <span class="mini-orbit orbit-three"></span>
              <span class="mini-planet mercury"></span>
              <span class="mini-planet venus"></span>
              <span class="mini-planet earth"></span>
              <span class="mini-planet mars"></span>
              <span class="mini-planet jupiter"></span>
              <span class="mini-planet saturn"></span>
            </span>
          </span>
          <span class="tile-badge" aria-hidden="true">Start</span>
          <span class="tile-label">
            <span class="tile-title">Planeten</span>
          </span>
        </a>
      </section>
    </main>
  </body>
</html>

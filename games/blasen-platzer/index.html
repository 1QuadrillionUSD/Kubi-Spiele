<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#9ed8f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Blasen-Platzer">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Blasen-Platzer</title>
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <main class="game-page">
      <div class="top-bar" aria-label="Spielwerte">
        <a class="icon-button home-button" href="../../" aria-label="Zur Spielesammlung">
          <span aria-hidden="true">&#8962;</span>
        </a>
        <div class="score-box">
          <span class="label">Geplatzt</span>
          <strong id="popped">0</strong>
        </div>
        <button class="icon-button sound-button" id="sound-button" type="button" aria-label="Ton an/aus">
          <span aria-hidden="true" id="sound-icon">&#128266;</span>
        </button>
        <button class="icon-button pause-button" id="pause-button" type="button" aria-label="Pause">
          <span aria-hidden="true">&#10074;&#10074;</span>
        </button>
      </div>

      <section class="play-area" aria-label="Blasen-Platzer Spielfeld">
        <canvas id="game-canvas" aria-label="Spielfeld: Bunte Seifenblasen antippen und platzen lassen"></canvas>

        <div class="start-panel" id="start-panel">
          <h1 id="panel-title">Blasen-Platzer</h1>
          <p class="panel-text" id="panel-text"></p>
          <div class="panel-buttons">
            <button class="primary-button" id="start-button" type="button">
              <span aria-hidden="true" id="start-button-icon">&#9654;</span>
              <span id="start-button-label">Los geht's</span>
            </button>
            <a class="secondary-button" href="../../">
              <span aria-hidden="true">&#8962;</span>
              <span>Zur Sammlung</span>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>

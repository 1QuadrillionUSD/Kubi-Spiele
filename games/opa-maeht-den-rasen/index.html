<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#33a474">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Opa maeht den Rasen">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Opa mäht den Rasen</title>
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <main class="game-page">
      <div class="top-bar" aria-label="Spielwerte">
        <a class="icon-button home-button" href="../../" aria-label="Zur Spielesammlung">
          <span aria-hidden="true">&#8962;</span>
        </a>
        <div class="progress-box">
          <span class="label">Garten fertig</span>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <strong id="progress-text">0 %</strong>
        </div>
        <div class="score-box">
          <span class="label">Sterne</span>
          <strong id="score">0</strong>
        </div>
        <button class="icon-button sound-button" id="sound-button" type="button" aria-label="Ton an/aus">
          <span aria-hidden="true" id="sound-icon">&#128266;</span>
        </button>
      </div>

      <section class="play-area" aria-label="Opas Garten">
        <canvas id="game-canvas" aria-label="Opas Garten Spielfeld"></canvas>

        <div class="joystick" id="joystick" aria-hidden="true">
          <div class="joystick-base">
            <div class="joystick-knob" id="joystick-knob"></div>
          </div>
        </div>

        <div class="touch-hint" id="touch-hint" aria-hidden="true">
          <span>&#128072;</span>
          <span>Joystick ziehen, um Opa zu bewegen</span>
        </div>

        <div class="start-panel" id="start-panel">
          <h1 id="panel-title">Opa mäht den Rasen</h1>
          <p class="panel-text" id="panel-text">
            Hilf Opa, den Garten schön zu machen! Bewege ihn einfach mit dem
            Joystick oder den Pfeiltasten über das hohe Gras.
          </p>
          <button class="primary-button" id="start-button" type="button">
            <span aria-hidden="true">&#9654;</span>
            <span id="start-button-label">Los geht's</span>
          </button>
        </div>
      </section>

      <div class="control-bar" aria-label="Spielsteuerung">
        <button class="control-button" id="pause-button" type="button" aria-label="Pause">
          <span aria-hidden="true">&#10074;&#10074;</span>
        </button>
        <button class="control-button" id="restart-button" type="button" aria-label="Neuer Garten">
          <span aria-hidden="true">&#8635;</span>
        </button>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e2574c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Oma backt den Kuchen">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Oma backt den Kuchen</title>
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./game.js"></script>
  </head>
  <body>
    <main class="game-page">
      <div class="top-bar" aria-label="Spielwerte">
        <a class="icon-button home-button" href="../../" aria-label="Zur Spielesammlung">
          <span aria-hidden="true">&#8962;</span>
        </a>
        <div class="score-box">
          <span class="label">Zutaten</span>
          <strong id="caught">0/30</strong>
        </div>
        <div class="score-box">
          <span class="label">Verschüttet</span>
          <strong id="missed">0/6</strong>
        </div>
      </div>

      <section class="play-area" aria-label="Oma backt den Kuchen">
        <canvas id="game-canvas" aria-label="Spielfeld: Zutaten auffangen"></canvas>
        <div class="touch-hint" aria-hidden="true">
          <span>&larr;</span>
          <span>ziehen</span>
          <span>&rarr;</span>
        </div>
        <div class="start-panel" id="start-panel">
          <h1>Oma backt<br>den Kuchen</h1>
          <p class="hint-text" id="hint-text">Fang die Zutaten mit der Schüssel auf!</p>
          <button class="primary-button" id="start-button" type="button">
            <span aria-hidden="true">&#9654;</span>
            <span>Start</span>
          </button>
        </div>
      </section>

      <div class="control-bar" aria-label="Spielsteuerung">
        <button class="control-button" id="left-button" type="button" aria-label="Nach links bewegen">
          <span aria-hidden="true">&larr;</span>
        </button>
        <button class="control-button" id="pause-button" type="button" aria-label="Pause">
          <span aria-hidden="true">&#10074;&#10074;</span>
        </button>
        <button class="control-button" id="restart-button" type="button" aria-label="Neustart">
          <span aria-hidden="true">&#8635;</span>
        </button>
        <button class="control-button" id="right-button" type="button" aria-label="Nach rechts bewegen">
          <span aria-hidden="true">&rarr;</span>
        </button>
      </div>
    </main>
  </body>
</html>
